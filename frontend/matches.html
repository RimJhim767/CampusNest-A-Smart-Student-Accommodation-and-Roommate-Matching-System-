<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your roommate matches — CampusNest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container navbar">
    <a href="index.html" class="logo">Campus<span>Nest</span></a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#how-it-works">How It Works</a>
      <a href="preferences.html" class="active">Find Roommate</a>
      <a href="profile.html">My Profile</a>
    </nav>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-secondary">Login</a>
      <a href="register.html" class="btn btn-primary">Get Started</a>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <div class="page-head">
      <div class="eyebrow">Based on your preferences</div>
      <h1>Your roommate matches</h1>
    </div>

    <div id="matches-root">

      <!-- Estimate notice: text comes from the server (GET /api/matches "disclaimer") -->
      <div id="matches-notice" class="demo-banner" hidden></div>

      <!-- Loading / empty / error / logged-out / setup-needed messages are drawn here by js/script.js -->
      <div id="matches-state" aria-live="polite" aria-busy="false"></div>

      <div id="matches-results" hidden>
        <div class="match-summary">
          <strong id="match-count">0</strong>
          <span id="match-count-label">potential matches found</span>
        </div>

        <div class="filters-bar">
          <div>
            <label for="filter-band">Compatibility</label>
            <select id="filter-band">
              <option value="all">Any compatibility</option>
              <option value="Strong">Strong</option>
              <option value="Good">Good</option>
              <option value="Fair">Fair</option>
            </select>
          </div>
          <div class="filter-count" id="filter-count" aria-live="polite"></div>
        </div>

        <p id="filter-empty" class="pref-note" hidden>No matches in this compatibility band. Choose "Any compatibility" to see everyone.</p>

        <div class="match-grid" id="match-grid"></div>
      </div>

    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">CampusNest</div>
    <div class="footer-meta">NITER Student Project · © 2026 CampusNest</div>
  </div>
</footer>

<script src="js/script.js"></script>
</body>
</html>
